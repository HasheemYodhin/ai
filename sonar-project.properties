# SonarQube/SonarCloud project configuration, used by the `sonarqube` job
# in .github/workflows/platform-ci.yml (sonarsource/sonarqube-scan-action).
#
# This repository does not have a SonarQube server configured yet. This
# file is a documented placeholder — fill in the values below (or set them
# as repository variables/secrets instead, which take precedence in the
# workflow) once a server/project is provisioned. See
# docs/ci-cd-pipeline.md#sonarqube for the full setup steps.
#
# sonar.projectKey is normally passed via the SONAR_PROJECT_KEY repository
# variable (falls back to "dabba" if unset) rather than hardcoded here, so
# it can differ between a staging and production SonarQube project without
# editing this file.

sonar.sources=dabba,frontend/src
sonar.tests=dabba/tests,frontend/src
sonar.test.inclusions=**/*test*.py,**/*.test.tsx,**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**,**/*.gguf,llama.cpp/**,dabba-8b-gguf/**

sonar.python.version=3.10
sonar.python.coverage.reportPaths=coverage.xml

# No JS/TS coverage report is wired in yet — frontend/package.json's
# devDependencies don't currently include @vitest/coverage-v8. Add it and a
# `vitest run --coverage` step, then point this at the produced lcov.info.
# sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
