api_endpoint: http://localhost:8080
api_key: ''
default_model: dabba
effort: medium
api_keys: {}
default_temperature: 0.7
default_max_tokens: 4096
default_top_p: 0.9
stream_output: true
show_token_usage: true
show_tool_calls: true
require_tool_approval: true
permission_mode: ask
history_file: /home/hasheem/Hasheem files/Hasheem sub foders/ai/.dabba-data/history.jsonl
max_history_files: 50
theme: dark
syntax_theme: monokai
auto_save_interval: 120
watch_files: true
watch_extensions:
- .py
- .js
- .ts
- .rs
- .go
- .md
- .txt
- .yaml
- .json
- .toml
allowed_ssh_hosts: []
allowed_docker_containers: []
allowed_docker_images: []
secret_store: encrypted
