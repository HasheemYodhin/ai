name: PR Metadata Automation

# pull_request_target runs with write access to the repo, using the
# WORKFLOW FILE and default checkout from the *base* branch — not the PR
# branch. Every step below only reads PR metadata through the GitHub API
# (title, body, changed-file list) or checks out the trusted base-branch
# copy of these scripts. It never checks out or executes the PR head's
# code, which is what makes it safe to run with write permissions against
# fork PRs. Building/testing the PR's own code happens in the separate,
# unprivileged pr-validation.yml / platform-ci.yml workflows instead.
"on":
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch (trusted — not the PR head)
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Normalize PR title from branch name (only if generic)
        id: title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NEW_TITLE="$(python3 .github/scripts/normalize_title.py --branch "$HEAD_REF" --title "$PR_TITLE")"
          if [ -n "$NEW_TITLE" ] && [ "$NEW_TITLE" != "$PR_TITLE" ]; then
            echo "Normalizing title: '$PR_TITLE' -> '$NEW_TITLE'"
            gh pr edit "$PR_NUMBER" --repo "$REPO" --title "$NEW_TITLE"
            echo "final_title=$NEW_TITLE" >> "$GITHUB_OUTPUT"
          else
            echo "Leaving title unchanged: '$PR_TITLE'"
            echo "final_title=$PR_TITLE" >> "$GITHUB_OUTPUT"
          fi

      - name: Update automated summary in PR description
        uses: actions/github-script@v7
        with:
          script: |
            const startMarker = "<!-- PR-AUTOMATION-SUMMARY:START -->";
            const endMarker = "<!-- PR-AUTOMATION-SUMMARY:END -->";

            const { owner, repo } = context.repo;
            const pr_number = context.payload.pull_request.number;

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pr_number });

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: pr_number, per_page: 100,
            });
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr_number, per_page: 100,
            });

            // Top-level directory (or bare filename) per changed file, deduped,
            // gives a quick sense of "main changed areas" without leaking full
            // file contents or anything sensitive.
            const areas = [...new Set(files.map(f => f.filename.split("/")[0]))].sort();

            const summaryBody = [
              "## Automated Summary",
              "",
              `- Source branch: \`${pr.head.ref}\``,
              `- Target branch: \`${pr.base.ref}\``,
              `- Author: @${pr.user.login}`,
              `- Number of commits: ${commits.length}`,
              `- Files changed: ${files.length}`,
              `- Main changed areas: ${areas.length ? areas.map(a => `\`${a}\``).join(", ") : "_none_"}`,
            ].join("\n");

            const block = `${startMarker}\n${summaryBody}\n${endMarker}`;

            const currentBody = pr.body || "";
            let newBody;
            if (currentBody.includes(startMarker) && currentBody.includes(endMarker)) {
              const start = currentBody.indexOf(startMarker);
              const end = currentBody.indexOf(endMarker) + endMarker.length;
              // Only the content between the markers is replaced — every
              // developer-written section (Details, Test Plan, Type, User
              // Impact, Release Notes, or anything else) is preserved verbatim.
              newBody = currentBody.slice(0, start) + block + currentBody.slice(end);
            } else {
              newBody = currentBody.length ? `${currentBody}\n\n${block}\n` : `${block}\n`;
            }

            if (newBody !== currentBody) {
              await github.rest.pulls.update({ owner, repo, pull_number: pr_number, body: newBody });
            }

      - name: Label based on changed files
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false

      - name: Label based on PR title type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINAL_TITLE: ${{ steps.title.outputs.final_title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$FINAL_TITLE" in
            feat*)     LABEL="feature" ;;
            fix*)      LABEL="bug" ;;
            docs*)     LABEL="documentation" ;;
            chore*)    LABEL="maintenance" ;;
            refactor*) LABEL="refactor" ;;
            *)         LABEL="" ;;
          esac

          if [ -z "$LABEL" ]; then
            echo "No title-derived label for '$FINAL_TITLE'."
            exit 0
          fi

          # A label that doesn't exist yet in the repo must not fail the whole
          # run — an administrator just needs to create it once (see
          # docs/pull-request-automation.md).
          if gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$LABEL" 2>err.log; then
            echo "Added label: $LABEL"
          else
            echo "::warning::Could not add label '$LABEL' — it may not exist yet in this repository. See docs/pull-request-automation.md."
            cat err.log
          fi
