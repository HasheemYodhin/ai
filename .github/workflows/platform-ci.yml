name: Dabba Platform CI

"on":
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-server.txt pytest
      - name: Compile backend
        run: python -m compileall -q dabba
      - name: Full server/agent/platform test suite
        env:
          DABBA_DATA_DIR: ${{ runner.temp }}/dabba-data
        # Everything except the torch-based model/training tests (see the
        # separate `model` job below) — those need requirements.txt's much
        # heavier deps (torch, datasets) and are kept isolated so a slow or
        # flaky training test never blocks the fast, everyday backend suite.
        run: >
          python -m pytest dabba/tests/ -q
          --ignore=dabba/tests/test_inference.py
          --ignore=dabba/tests/test_rag.py
          --ignore=dabba/tests/test_attention.py
          --ignore=dabba/tests/test_model.py
          --ignore=dabba/tests/test_tokenizer.py
          --ignore=dabba/tests/test_trainer.py
          --ignore=dabba/tests/test_multimodal.py
          --ignore=dabba/tests/test_data.py

  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Model/training/RAG test suite (torch-based)
        run: >
          python -m pytest
          dabba/tests/test_inference.py
          dabba/tests/test_rag.py
          dabba/tests/test_attention.py
          dabba/tests/test_model.py
          dabba/tests/test_tokenizer.py
          dabba/tests/test_trainer.py
          dabba/tests/test_multimodal.py
          dabba/tests/test_data.py
          -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dabba:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
