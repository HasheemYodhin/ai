services:
  dabba:
    build:
      context: ..
      dockerfile: Dockerfile
    image: dabba:latest
    container_name: dabba-server
    ports:
      - "8080:8080"
    environment:
      - DABBA_API_KEY=${DABBA_API_KEY:-}
      - DABBA_DATA_DIR=/data
      - DABBA_MODEL_PATH=${DABBA_MODEL_PATH:-rule_based}
      - DABBA_MAX_TOKENS=${DABBA_MAX_TOKENS:-2048}
      - DABBA_DEVICE=${DABBA_DEVICE:-auto}
      - DABBA_LOG_LEVEL=${DABBA_LOG_LEVEL:-info}
      - DABBA_MODEL_FALLBACKS=${DABBA_MODEL_FALLBACKS:-{}}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - dabba-models:/app/models
      - dabba-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  dabba-models:
    driver: local
  dabba-data:
    driver: local
