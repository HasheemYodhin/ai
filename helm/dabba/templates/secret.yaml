{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dabba.secretName" . }}
  labels:
    {{- include "dabba.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secret.apiKeyKey }}: {{ .Values.secret.apiKey | quote }}
{{- end }}
