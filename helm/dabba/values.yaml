# Set this to the image published by .github/workflows/docker-build-push.yml.
image:
  repository: dabba
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: dabba.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

persistence:
  enabled: true
  mountPath: /data
  accessModes: [ReadWriteOnce]
  size: 10Gi
  storageClass: ""
  annotations: {}

api:
  modelPath: rule_based
  maxTokens: "2048"
  device: auto
  logLevel: info
  modelFallbacks: "{}"
  extraEnv: []

secret:
  # Prefer existingSecret in production. If create is true, apiKey is stored
  # in a Kubernetes Secret rendered by this chart.
  create: false
  existingSecret: ""
  apiKey: ""
  apiKeyKey: DABBA_API_KEY

health:
  liveness:
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
